name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@42c378ffbb438be29e3e1848d520fb0a8ee1c271 # v3.38.0
        with:
          languages: go
      - uses: github/codeql-action/autobuild@42c378ffbb438be29e3e1848d520fb0a8ee1c271 # v3.38.0
      - uses: github/codeql-action/analyze@42c378ffbb438be29e3e1848d520fb0a8ee1c271 # v3.38.0
